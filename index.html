<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:ital,wght@0,400;0,500;0,600;1,400&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,500;0,8..60,600;0,8..60,700;1,8..60,400;1,8..60,500&display=swap"
      rel="stylesheet"
    />
    <title>Valence</title>
    <script>
      (function () {
        var stored = localStorage.getItem('valence-theme')
        var mode = 'dark'
        var palette = 'default'

        if (stored === 'light' || stored === 'dark') {
          mode = stored
        } else if (stored) {
          try {
            var parsed = JSON.parse(stored)
            if (parsed.mode === 'light' || parsed.mode === 'dark') mode = parsed.mode
            if (
              parsed.palette === 'default' ||
              parsed.palette === 'dune' ||
              parsed.palette === 'nocturne' ||
              parsed.palette === 'custom'
            ) {
              palette = parsed.palette === 'nocturne' ? 'dune' : parsed.palette
            }
          } catch (e) {}
        }

        if (mode === 'dark') document.documentElement.classList.add('dark')
        document.documentElement.dataset.theme = mode
        if (palette !== 'default') document.documentElement.dataset.palette = palette

        if (palette === 'custom') {
          var customCss = localStorage.getItem('valence-custom-theme-css')
          if (customCss) {
            var style = document.createElement('style')
            style.id = 'valence-custom-theme'
            style.textContent = customCss
            document.head.appendChild(style)
          }
        }

        var componentCss = localStorage.getItem('valence-component-theme-css')
        if (componentCss) {
          var componentStyle = document.createElement('style')
          componentStyle.id = 'valence-component-theme'
          componentStyle.textContent = componentCss
          document.head.appendChild(componentStyle)
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
